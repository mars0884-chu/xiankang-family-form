name: Publish genealogy form v0.11
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v011.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact v0.11 from last good v0.10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          base=subprocess.check_output(['git','show','73cd0cf3b10991344ddc7600a0c5666805d12fcd:index.html']).decode('utf-8')
          t=base.replace('v0.10','v0.11').replace('第十版測試 v0.11','第十一版測試 v0.11')
          old='''          <label for="pName">姓名 *</label>
                    <input id="pName" placeholder="不知道真名可填「姓名待補」">'''
          new='''          <label for="pName">姓名 *</label>
                    <input id="pName" placeholder="有中文姓名時填中文姓名；沒有中文姓名時填本人主要使用姓名">
                    <label for="pForeignName">外文姓名（選填）</label>
                    <input id="pForeignName" placeholder="例如：Rajinder Singh Channa；不知道姓／名／中間名怎麼拆也沒關係，照完整姓名填">
                    <p class="small"><strong>中文姓名與外文姓名可以同時存在：</strong>有中文姓名時，本欄「姓名」以中文姓名為主，外文姓名另外填在這一格；不要把外文姓名放進「曾用名／其他名字」。若目前只知道完整外文姓名，不要自行猜哪一段是姓、名或中間名。</p>'''
          if old not in t: raise SystemExit('name marker missing')
          t=t.replace(old,new,1)
          old='''      <p class="small"><strong>同一人有中文名＋英文名：</strong>這一格只填一個主要姓名，不要把兩個名字一起塞在同一格。若要完整保存另一個名字，最好也把配偶本人新增成一位家人，再把另一姓名填在他的「曾用名／其他名字」。若這裡只填一個具名配偶、但沒有另外新增人物卡，匯入工具可先建立最小配偶節點；若偵測到疑似多個姓名混在同一格，會停止自動建立並交給主編確認。</p>'''
          new='''      <p class="small"><strong>同一人有中文姓名＋外文姓名：</strong>這一格只填主要姓名，不要把兩個姓名一起塞在同一格。最好也把配偶本人新增成一位家人：中文姓名填「姓名」，外文姓名填「外文姓名」。若只填一個具名配偶但沒有另外新增人物卡，匯入工具仍可先建立最小配偶節點；若偵測到疑似多個姓名混在同一格，會停止自動建立並交給主編確認。</p>'''
          if old not in t: raise SystemExit('spouse marker missing')
          t=t.replace(old,new,1)
          old="return {name:'',nameStatus:'完整',gender:'',rel:'',life:'',birth:'',father:'',mother:'',spouse:'',marriage:'',spouseTitle:'',spouseSeq:'',"
          new="return {name:'',foreignName:'',nameStatus:'完整',gender:'',rel:'',life:'',birth:'',father:'',mother:'',spouse:'',marriage:'',spouseTitle:'',spouseSeq:'',"
          if old not in t: raise SystemExit('blankPerson marker missing')
          t=t.replace(old,new,1)
          old="setVal('pName',draft.name);setVal('pNameStatus',draft.nameStatus||'完整');"
          new="setVal('pName',draft.name);setVal('pForeignName',draft.foreignName);setVal('pNameStatus',draft.nameStatus||'完整');"
          if old not in t: raise SystemExit('open marker missing')
          t=t.replace(old,new,1)
          old="draft.name=cleanName($('pName').value);draft.nameStatus=$('pNameStatus').value||'完整';"
          new="draft.name=cleanName($('pName').value);draft.foreignName=cleanName($('pForeignName').value);draft.nameStatus=$('pNameStatus').value||'完整';"
          if old not in t: raise SystemExit('collect marker missing')
          t=t.replace(old,new,1)
          old="""d.innerHTML='<div class="personHead"><div><div class="personName">'+(i+1)+'. '+escHtml(p.name)+'</div><div class="small">'+escHtml(p.rel)+'｜'+escHtml(p.gender)+'｜'+escHtml(p.life)+' '+photoN+'</div></div>'+"""
          new="""d.innerHTML='<div class="personHead"><div><div class="personName">'+(i+1)+'. '+escHtml(p.name)+'</div>'+(p.foreignName?'<div class="small">外文姓名：'+escHtml(p.foreignName)+'</div>':'')+'<div class="small">'+escHtml(p.rel)+'｜'+escHtml(p.gender)+'｜'+escHtml(p.life)+' '+photoN+'</div></div>'+"""
          if old not in t: raise SystemExit('people list marker missing')
          t=t.replace(old,new,1)
          old="var mainHeaders=['姓名*','同名／辨識補充','姓名完整狀態*'"
          new="var mainHeaders=['姓名*','外文姓名','同名／辨識補充','姓名完整狀態*'"
          if old not in t: raise SystemExit('headers marker missing')
          t=t.replace(old,new,1)
          old="main.push([p.name,disambig,p.nameStatus||'完整',p.rel,"
          new="main.push([p.name,p.foreignName||'',disambig,p.nameStatus||'完整',p.rel,"
          if old not in t: raise SystemExit('row marker missing')
          t=t.replace(old,new,1)
          old="['欄位說明｜簡易填報工具自動輸出'],\n    ['項目','說明'],"
          new="['欄位說明｜簡易填報工具自動輸出'],\n    ['項目','說明'],\n    ['外文姓名','選填。中文姓名與外文姓名可同時存在；有中文姓名時，中文姓名放「姓名」，外文姓名另填本欄。完整字串照原樣保存，不必先拆姓／名／中間名。'],"
          if old not in t: raise SystemExit('guide marker missing')
          t=t.replace(old,new,1)
          old="['配偶姓名／其他名字','主要配偶欄只填一個主要姓名。同一人另有中文名、英文名或曾用名時，最好把配偶本人也新增一張人物卡，再把另一姓名填入「曾用名／其他名字」；不要把兩個姓名擠在同一格。'],"
          new="['配偶姓名／外文姓名','主要配偶欄只填一個主要姓名。同一人有中文姓名與外文姓名時，最好把配偶本人也新增一張人物卡：中文姓名放「姓名」，外文姓名放「外文姓名」；不要把兩個姓名擠在同一格。'],"
          if old not in t: raise SystemExit('guide spouse marker missing')
          t=t.replace(old,new,1)
          old="['說明','此 Excel 由行動填報工具 v0.11 在族人手機本機產生；範例資料不會寫入正式人物資料。軍旅職涯請當工作／職務填；任何軍事或公職工作都不要填現役部隊番號、精確駐地、任務內容、兵籍號／人事編號、內部承辦或其他機敏資料。']"
          new="['說明','此 Excel 由行動填報工具 v0.11 在族人手機本機產生；範例資料不會寫入正式人物資料。中文姓名與外文姓名分開保存；外文姓名不知道姓／名／中間名怎麼拆時照完整字串填即可。軍旅職涯請當工作／職務填；任何軍事或公職工作都不要填現役部隊番號、精確駐地、任務內容、兵籍號／人事編號、內部承辦或其他機敏資料。']"
          if old not in t: raise SystemExit('intro marker missing')
          t=t.replace(old,new,1)
          raw=t.encode('utf-8')
          got=hashlib.sha256(raw).hexdigest()
          expected='0228cdc61e67d9a01d2885fdcf92022a237fe806ba71230145f917db27b82489'
          if got!=expected: raise SystemExit('hash mismatch '+got)
          Path('index.html').write_bytes(raw)
          print('exact v0.11',got)
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish genealogy form v0.11 external-name field"
          git push