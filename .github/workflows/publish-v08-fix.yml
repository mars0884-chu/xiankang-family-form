name: Publish standalone genealogy form v0.8 fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade current v0.7 index to v0.8
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          DATA=''''''
          script=gzip.decompress(base64.b64decode(DATA))
          Path('/tmp/upgrade_v08.py').write_bytes(script)
          exec(compile(script,'upgrade_v08.py','exec'))
          PY
      - name: Verify exact v0.8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('index.html').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='719ae755c5d53e86b592a9f3f0859f11d90b7d80a6707d2842f911e1a94d1a3a'
          t=b.decode('utf-8')
          assert '第八版測試 v0.8' in t and '指導論文' in t and '＋ 新增一筆工作／職務' in t
          print('verified',len(b))
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "Publish standalone genealogy form v0.8"
            git push
          fi
