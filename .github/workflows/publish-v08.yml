name: Publish standalone genealogy form v0.8
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write exact standalone v0.8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          DATA='''[... ELLIPSIZATION ...]'''
          raw=gzip.decompress(base64.b64decode(DATA))
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='719ae755c5d53e86b592a9f3f0859f11d90b7d80a6707d2842f911e1a94d1a3a', sha
          text=raw.decode('utf-8')
          assert '第八版測試 v0.8' in text
          assert '本人學位論文' in text and '指導論文' in text and '工作／職務' in text
          Path('index.html').write_bytes(raw)
          print('written index.html',len(raw),sha)
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "Publish standalone genealogy form v0.8"
            git push
          fi
