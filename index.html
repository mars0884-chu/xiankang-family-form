<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咸康（台灣）分支｜族人行動填報 v0.4</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f6f1eb;color:#2b2522;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#fff;border-radius:18px;padding:22px}h1{font-size:26px}.msg{font-size:18px;line-height:1.7}</style></head><body><div class="box"><h1>咸康（台灣）分支｜家族資料填報</h1><div id="msg" class="msg">正在開啟填報工具，請稍候…</div></div><script>
(async()=>{try{
const src='https://raw.githubusercontent.com/mars0884-chu/baseball-GM/d1d3717cb012cac9c706064c7e1aaaa67bf2a702/genealogy-form-v03/index.html';
let t=await fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀取測試版失敗');return r.text()});
for(const [a,b] of [['族人簡易填報工具 v0.3','族人簡易填報工具 v0.4'],['第三版測試 v0.3','第四版測試 v0.4'],['行動填報工具 v0.3','行動填報工具 v0.4'],['簡易填報工具 v0.3','簡易填報工具 v0.4']])t=t.replaceAll(a,b);
t=t.replace('出生日期（民國或西元皆可）','出生日期／年代（民國、西元、年號皆可）').replace('例如：民國108年10月18日，或2019-10-18','例如：民國108年10月18日、2019-10-18、1081018，或清光緒辛丑年').replace('不用換算；匯出時能辨識的日期會自動統一成民國格式。','不用換算；能辨識的現代日期會自動統一成民國格式。像「清光緒辛丑年」這類年號文字會原樣保留，不自行改寫。');
t=t.replace('<p>可以一次填自己、父母、配偶、子女或其他親人。每個人都是一張簡單卡片。</p>\n    <div id="peopleList"></div>','<p>可以一次填自己、父母、配偶、子女或其他親人。每完成一人，都會留在下方清單，可隨時按「回去修改」。</p>\n    <div id="peopleCount" class="privacy card" style="margin:10px 0;padding:12px 14px"><strong>目前已填 0 人</strong><div class="small">新增下一人前，請先確認前面的人是否都在這裡。</div></div>\n    <div id="peopleList"></div>');
const old=`function renderPeople(){var box=$('peopleList');box.innerHTML='';if(!state.people.length){box.innerHTML='<p class="muted">還沒有新增人物。</p>';return}state.people.forEach(function(p,i){var d=document.createElement('div');d.className='person';var photoN=p.photos.length?'<span class="badge">照片 '+p.photos.length+'</span>':'';d.innerHTML='<div class="personHead"><div><div class="personName">'+escHtml(p.name)+'</div><div class="small">'+escHtml(p.rel)+'｜'+escHtml(p.gender)+'｜'+escHtml(p.life)+' '+photoN+'</div></div><div class="personBtns"><button class="ghost" data-edit="'+i+'">編輯</button><button class="danger" data-del="'+i+'">刪除</button></div></div><div class="small">父：'+escHtml(p.father||'未填')+'｜母：'+escHtml(p.mother||'未填')+'｜配偶：'+escHtml(p.spouse||'未填')+'</div>';box.appendChild(d)})}`;
const neu=`function renderPeople(){var box=$('peopleList');box.innerHTML='';var count=$('peopleCount');if(count){count.innerHTML='<strong>目前已填 '+state.people.length+' 人</strong><div class="small">'+(state.people.length?'下面每一位都可以按「回去修改」。':'還沒有新增人物。')+'</div>'}if(!state.people.length){box.innerHTML='<p class="muted">還沒有新增人物。</p>';return}state.people.forEach(function(p,i){var d=document.createElement('div');d.className='person';var photoN=p.photos.length?'<span class="badge">照片 '+p.photos.length+'</span>':'';d.innerHTML='<div class="personHead"><div><div class="personName">'+(i+1)+'. '+escHtml(p.name)+'</div><div class="small">'+escHtml(p.rel)+'｜'+escHtml(p.gender)+'｜'+escHtml(p.life)+' '+photoN+'</div></div><div class="personBtns"><button class="ghost" data-edit="'+i+'">回去修改</button><button class="danger" data-del="'+i+'">刪除</button></div></div><div class="small">父：'+escHtml(p.father||'未填')+'｜母：'+escHtml(p.mother||'未填')+'｜配偶：'+escHtml(p.spouse||'未填')+'</div>';box.appendChild(d)})}`;
t=t.replace(old,neu);
document.open();document.write(t);document.close();
}catch(e){document.getElementById('msg').innerHTML='目前無法載入填報工具。請稍後重新整理。<br><small>'+String(e)+'</small>';}})();
</script></body></html>
